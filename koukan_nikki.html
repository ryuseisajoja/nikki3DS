<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>イラストこうかん日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#c6e6f7;--sky2:#94c9ea;--sky3:#6cafdb;
    --plastic1:#fdfefe;--plastic2:#e7ebf2;--plastic3:#ccd3df;--plastic-edge:#aeb7c6;
    --bezel1:#40454f;--bezel2:#22252c;
    --paper:#f4f1fa;--frame:#aeb84a;--frame-2:#d8dd72;--ink:#33373f;
    --green1:#bfe879;--green2:#93c84e;--green3:#76af37;--green-edge:#5e9029;
    --blue1:#95d3f6;--blue2:#57b2e6;--blue3:#2f93d4;--blue-edge:#1f74af;
    --pink1:#ffb4c6;--pink2:#ff7d9e;--pink3:#ec5777;--pink-edge:#cd3d5e;
    --silver1:#ffffff;--silver2:#eef1f6;--silver3:#d7dce6;--silver-edge:#b4bbc9;
    --shadow:rgba(35,55,85,.32);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:16px;min-height:100%;overflow-x:hidden;
    background:
      repeating-linear-gradient(116deg,rgba(255,255,255,.22) 0 15px,rgba(255,255,255,0) 15px 30px),
      repeating-linear-gradient(116deg,rgba(255,255,255,.10) 0 3px,rgba(255,255,255,0) 3px 30px),
      linear-gradient(165deg,var(--sky1),var(--sky2) 55%,var(--sky3));
    background-size:240px 240px,240px 240px,100% 100%;
    background-attachment:fixed;
    animation:skyflow 26s linear infinite;
  }
  @keyframes skyflow{to{background-position:240px 0,240px 0,0 0;}}

  /* ===== ゼリーボタン共通の質感 ===== */
  .gel{position:relative;border:1px solid;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);overflow:hidden;}
  .gel::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none;}

  /* ===== ロック画面（システムダイアログ風） ===== */
  .lock{width:min(384px,100%);background:linear-gradient(180deg,#ffffff,#f3f6fb);border-radius:20px;padding:0 0 22px;text-align:center;overflow:hidden;
    box-shadow:inset 0 1px 0 #fff,0 2px 0 #c9d2df,0 16px 34px var(--shadow),0 0 0 1px #c4cdda;}
  .lock::before{content:"イラスト こうかん日記";display:block;font-weight:800;font-size:13px;letter-spacing:.12em;color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.25);padding:11px;background:linear-gradient(180deg,var(--blue1),var(--blue2) 55%,var(--blue3));
    border-bottom:1px solid var(--blue-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .lock .pad{padding:18px 22px 0;}
  .keyart{font-size:40px;margin:6px 0 2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  .lock h1{font-size:18px;font-weight:800;margin:2px 0 4px;color:#3a4150;}
  .lock p{font-size:12.5px;font-weight:700;color:#8b93a4;line-height:1.7;margin:0 0 12px;}
  .lock .err{color:var(--pink-edge);font-size:12px;font-weight:800;height:16px;margin-bottom:2px;}
  .lock input{width:100%;font-family:inherit;font-weight:700;font-size:18px;text-align:center;padding:12px 14px;border:none;border-radius:11px;
    background:#eef2f8;color:var(--ink);outline:none;margin-bottom:6px;
    box-shadow:inset 0 2px 5px rgba(70,90,120,.32),inset 0 -1px 0 #fff,0 0 0 2px #d4dbe6;}
  .lock input:focus{box-shadow:inset 0 2px 5px rgba(70,90,120,.32),0 0 0 2px var(--blue2);}
  .lock .note{font-size:11px;color:#9aa2b3;margin:2px 0 14px;font-weight:700;}
  .enter{width:100%;cursor:pointer;font-family:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:13px;
    border:1px solid var(--green-edge);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--green1),var(--green2) 48%,var(--green3));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -3px 4px rgba(0,0,0,.16),0 4px 0 var(--green-edge),0 7px 10px rgba(50,80,40,.3);transition:.08s;}
  .enter::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));pointer-events:none;}
  .enter:active{transform:translateY(4px);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 1px 0 var(--green-edge);}
  .recent{margin:18px 22px 0;text-align:left;}
  .recent .lbl{font-size:11px;font-weight:800;color:#8b93a4;margin-bottom:8px;letter-spacing:.05em;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{display:flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;color:#3f7fb0;
    padding:6px 8px 6px 12px;border-radius:999px;border:1px solid #cdd9e8;
    background:linear-gradient(180deg,#ffffff,#eaf1f9);box-shadow:inset 0 1px 0 #fff,0 2px 3px rgba(60,90,120,.18);transition:.1s;}
  .chip:active{transform:scale(.95);}
  .chip .no{color:#9aa6b6;font-size:10px;}
  .chip .x{width:18px;height:18px;border-radius:50%;background:#e3e9f1;color:#9aa6b6;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .chip .x:hover{background:var(--pink2);color:#fff;}

  /* ===== 本体（パール白プラ） ===== */
  .device{width:min(440px,100%);position:relative;border-radius:28px;padding:15px 15px 20px;border:1px solid var(--plastic-edge);
    background:linear-gradient(180deg,#ffffff 0%,var(--plastic2) 52%,var(--plastic3) 100%);
    box-shadow:inset 0 2px 2px #ffffff,inset 0 -4px 7px rgba(150,160,178,.6),inset 0 0 0 2px rgba(255,255,255,.7),
      0 3px 0 #b0b8c6,0 16px 32px rgba(35,55,85,.4);}
  .device::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:7px;border-radius:6px;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none;}
  .brand{text-align:center;font-weight:800;font-size:12px;letter-spacing:.14em;color:#9097a8;margin:3px 0 9px;user-select:none;
    text-shadow:0 1px 0 #ffffff;}
  .brand small{display:block;font-size:8.5px;letter-spacing:.32em;color:#b0b6c4;font-weight:700;}

  .roombar{display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:12px;padding:6px 8px 6px 13px;margin-bottom:12px;
    background:linear-gradient(180deg,#d9dfe9,#eef1f6);box-shadow:inset 0 2px 5px rgba(80,95,125,.4),inset 0 -1px 0 #fff,0 1px 0 #fff;}
  .roomno{font-weight:800;font-size:13px;color:#7e8699;white-space:nowrap;text-shadow:0 1px 0 #fff;}
  .roomno b{color:var(--pink-edge);font-size:15px;letter-spacing:.05em;}
  .acts{display:flex;gap:5px;}
  .icbtn{position:relative;cursor:pointer;font-family:inherit;font-weight:800;font-size:11px;padding:7px 9px;border-radius:10px;
    border:1px solid var(--silver-edge);color:#5d6472;display:flex;align-items:center;gap:4px;transition:.08s;
    background:linear-gradient(180deg,#ffffff,#e7ebf2 55%,#d6dce6);text-shadow:0 1px 0 #fff;
    box-shadow:inset 0 1px 0 #fff,0 2px 0 #c2c9d6,0 3px 4px rgba(60,80,110,.22);}
  .icbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #c2c9d6;}
  .icbtn svg{width:13px;height:13px;}
  .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;
    background:linear-gradient(180deg,#ff8aa2,var(--pink3));border:1px solid var(--pink-edge);
    color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .badge.show{display:flex;animation:bpop .3s cubic-bezier(.2,1.5,.5,1);}
  @keyframes bpop{0%{transform:scale(0)}100%{transform:scale(1)}}

  /* ===== 画面（黒フチ＋ガラス反射） ===== */
  .screen{border-radius:13px;padding:10px;background:linear-gradient(180deg,var(--bezel1),var(--bezel2));
    box-shadow:inset 0 1px 1px #5b606c,inset 0 -2px 3px #000,0 0 0 1px #16181d,0 4px 7px rgba(0,0,0,.32),0 2px 0 #c4cbd8;}

  .top-inner{position:relative;border-radius:7px;aspect-ratio:5/3;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(0deg,rgba(120,120,150,.045) 0 1px,rgba(255,255,255,0) 1px 3px),linear-gradient(180deg,#fdfdff,#f7f6fb);}
  .frame{position:absolute;inset:10px;border:3px solid var(--frame);border-radius:4px;
    box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--frame-2);pointer-events:none;}
  .frame::after{content:"";position:absolute;inset:0;border-radius:2px;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 300%;animation:shimmer 5s linear infinite;}
  @keyframes shimmer{0%{background-position:160% 0}100%{background-position:-60% 0}}
  .top-inner::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:linear-gradient(148deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 16%,rgba(255,255,255,0) 36%);}
  .entry-img{max-width:78%;max-height:80%;animation:pop .4s cubic-bezier(.2,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .empty{text-align:center;color:#a79fc0;font-weight:700;font-size:14px;line-height:1.7;padding:0 16px;}
  .empty b{color:var(--pink-edge);}
  .date{position:absolute;left:9px;top:7px;text-align:left;font-weight:800;font-size:15px;line-height:1.04;color:rgba(95,90,115,.5);letter-spacing:.02em;z-index:4;}
  .date small{font-size:12px;font-weight:800;}
  .avatar{position:absolute;left:7px;bottom:5px;width:66px;text-align:center;z-index:4;}
  .avatar svg{width:52px;height:52px;display:block;margin:0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
  .avatar .nm{font-size:9px;font-weight:800;color:#7f7896;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pagenum{position:absolute;right:8px;bottom:8px;width:27px;height:27px;border-radius:50%;z-index:4;
    background:linear-gradient(180deg,var(--green1),var(--green3));border:1px solid var(--green-edge);color:#fff;
    font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 1px rgba(0,0,0,.25);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 2px 3px rgba(0,0,0,.25);}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:46px;border:none;border-radius:8px;background:transparent;z-index:4;
    color:#c9bd8a;font-size:26px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;transition:.15s;text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .nav.show{display:flex;} .nav:hover{color:var(--green3);} .nav:active{transform:translateY(-50%) scale(.85);}
  .nav.prev{left:2px;} .nav.next{right:2px;}

  /* シェア行 */
  .shareRow{display:flex;gap:8px;margin:12px 0;}
  .shareRow button{flex:1;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;padding:11px;border-radius:12px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.08s;text-shadow:0 1px 1px rgba(0,0,0,.2);}
  .shareRow button::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;}
  .shareRow button:active{transform:translateY(3px);}
  .shareRow svg{width:16px;height:16px;}
  #saveImg{border:1px solid var(--silver-edge);color:#5d6472;text-shadow:0 1px 0 #fff;
    background:linear-gradient(180deg,#ffffff,#e7ebf2 55%,#d6dce6);box-shadow:inset 0 1px 0 #fff,0 3px 0 #c2c9d6,0 5px 7px rgba(60,80,110,.25);}
  #saveImg:active{box-shadow:inset 0 1px 0 #fff,0 1px 0 #c2c9d6;}
  #shareImg{border:1px solid var(--blue-edge);color:#fff;
    background:linear-gradient(180deg,var(--blue1),var(--blue2) 48%,var(--blue3));box-shadow:inset 0 1px 1px rgba(255,255,255,.85),0 3px 0 var(--blue-edge),0 6px 9px rgba(40,80,120,.3);}
  #shareImg:active{box-shadow:inset 0 1px 1px rgba(255,255,255,.85),0 1px 0 var(--blue-edge);}

  /* 下画面 */
  .bot-inner{border-radius:7px;padding:9px;display:flex;flex-direction:column;gap:8px;position:relative;
    background:radial-gradient(120% 100% at 50% 0%,#15141b,#0d0c12);}
  .who{display:flex;gap:6px;align-items:center;justify-content:space-between;}
  .who-tabs{display:flex;gap:6px;}
  .tab{cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;padding:6px 11px;border-radius:999px;color:#cfd3df;border:1px solid #2c2a38;
    background:linear-gradient(180deg,#46435a,#322f40);transition:.12s;display:flex;align-items:center;gap:5px;max-width:130px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
  .tab .mini{width:18px;height:18px;flex:none;} .tab .tnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab.on{color:#fff;border-color:var(--pink-edge);text-shadow:0 1px 1px rgba(0,0,0,.25);
    background:linear-gradient(180deg,var(--pink1),var(--pink2) 50%,var(--pink3));box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 2px 4px rgba(0,0,0,.3);}
  .tab.on.aite{border-color:var(--blue-edge);background:linear-gradient(180deg,var(--blue1),var(--blue2) 50%,var(--blue3));}
  .hint{color:#7a7790;font-size:10px;font-weight:700;}
  .canvas-wrap{position:relative;background:#fbf9ff;border-radius:6px;overflow:hidden;aspect-ratio:5/3;box-shadow:inset 0 0 0 2px #000,inset 0 2px 4px rgba(0,0,0,.3);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #cv{touch-action:none;}
  .canvas-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:linear-gradient(150deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.08) 12%,rgba(255,255,255,0) 30%);}

  .palette-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .colors{display:flex;gap:5px;}
  .sw{width:25px;height:25px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25);transition:.12s;
    box-shadow:inset 0 2px 2px rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4);}
  .sw.on{border-color:#fff;transform:scale(1.18);box-shadow:inset 0 2px 2px rgba(255,255,255,.5),0 0 0 2px #ffffff88,0 1px 3px rgba(0,0,0,.5);}
  .tool-btn{cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;padding:7px 10px;border-radius:9px;border:1px solid #c4cad6;
    color:#56607a;display:flex;align-items:center;gap:4px;transition:.1s;text-shadow:0 1px 0 #fff;
    background:linear-gradient(180deg,#ffffff,#e4e8f0);box-shadow:inset 0 1px 0 #fff,0 2px 0 #c2c9d6,0 2px 3px rgba(0,0,0,.25);}
  .tool-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #c2c9d6;}
  .tool-btn.on{background:linear-gradient(180deg,#ffe3ea,#ffc6d4);border-color:var(--pink-edge);color:var(--pink-edge);box-shadow:inset 0 1px 0 #fff,0 0 0 2px var(--pink2);}
  .spacer{flex:1;}

  .subrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .subrow .cap{color:#807c95;font-size:10px;font-weight:800;margin-right:2px;}
  .mini-btn{cursor:pointer;font-family:inherit;font-weight:800;font-size:11px;padding:6px 9px;border-radius:8px;border:1px solid #2c2a38;
    background:linear-gradient(180deg,#3a3850,#2a2838);color:#cfc8e2;transition:.1s;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
  .mini-btn.on{background:linear-gradient(180deg,#ffffff,#eef0f6);color:#3a3540;border-color:#c4cad6;box-shadow:inset 0 1px 0 #fff,0 2px 3px rgba(0,0,0,.3);}
  .mini-btn:active{transform:translateY(1px);}
  .stamp-btn{cursor:pointer;border:1px solid #2c2a38;border-radius:8px;padding:4px 7px;font-size:16px;transition:.1s;line-height:1;
    background:linear-gradient(180deg,#3a3850,#2a2838);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
  .stamp-btn.on{background:linear-gradient(180deg,#ffffff,#eef0f6);border-color:var(--pink-edge);box-shadow:inset 0 1px 0 #fff,0 0 0 2px var(--pink2);}
  .stamp-btn:active{transform:translateY(1px);}

  .save{cursor:pointer;font-family:inherit;font-weight:800;font-size:16px;padding:12px;border-radius:12px;color:#fff;width:100%;position:relative;overflow:hidden;
    border:1px solid var(--green-edge);text-shadow:0 1px 1px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;gap:7px;transition:.08s;
    background:linear-gradient(180deg,var(--green1),var(--green2) 48%,var(--green3));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -3px 4px rgba(0,0,0,.16),0 4px 0 var(--green-edge),0 7px 10px rgba(50,80,40,.3);}
  .save::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;}
  .save:active{transform:translateY(4px);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 1px 0 var(--green-edge);}
  .save svg{width:18px;height:18px;position:relative;z-index:1;}

  /* 設定モーダル */
  .modal{position:fixed;inset:0;background:rgba(25,40,65,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;backdrop-filter:blur(2px);}
  .modal.show{display:flex;}
  .sheet{width:min(360px,100%);background:linear-gradient(180deg,#ffffff,#f3f6fb);border-radius:20px;padding:0 0 20px;overflow:hidden;max-height:90vh;overflow-y:auto;
    box-shadow:inset 0 1px 0 #fff,0 2px 0 #c9d2df,0 20px 50px var(--shadow),0 0 0 1px #c4cdda;}
  .sheet h2{font-size:16px;font-weight:800;margin:0 0 14px;text-align:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);
    padding:12px;background:linear-gradient(180deg,var(--blue1),var(--blue2) 55%,var(--blue3));border-bottom:1px solid var(--blue-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .pfield{margin:0 20px 16px;}
  .pfield .who-lbl{font-size:12px;font-weight:800;color:#8b93a4;margin-bottom:6px;}
  .pfield input{width:100%;font-family:inherit;font-weight:700;font-size:15px;padding:10px 12px;border:none;border-radius:10px;background:#eef2f8;outline:none;margin-bottom:8px;
    box-shadow:inset 0 2px 4px rgba(70,90,120,.3),0 0 0 2px #d4dbe6;}
  .pfield input:focus{box-shadow:inset 0 2px 4px rgba(70,90,120,.3),0 0 0 2px var(--blue2);}
  .avgrid{display:flex;gap:6px;flex-wrap:wrap;}
  .avopt{width:46px;height:46px;border-radius:12px;border:2px solid #d7dde8;cursor:pointer;padding:2px;transition:.12s;
    background:linear-gradient(180deg,#ffffff,#eef1f6);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.12);}
  .avopt svg{width:100%;height:100%;}
  .avopt.on{border-color:var(--pink2);box-shadow:0 0 0 2px #ffd2dc,inset 0 1px 0 #fff;}
  .sheet .done{cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;padding:12px;border-radius:13px;color:#fff;width:calc(100% - 40px);margin:4px 20px 0;
    border:1px solid var(--green-edge);text-shadow:0 1px 1px rgba(0,0,0,.28);position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--green1),var(--green2) 48%,var(--green3));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 4px 0 var(--green-edge),0 6px 9px rgba(50,80,40,.3);}
  .sheet .done::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;}
  .sheet .done:active{transform:translateY(3px);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 1px 0 var(--green-edge);}

  .presence{font-weight:800;font-size:11.5px;text-align:center;padding:7px;border-radius:10px;margin-bottom:12px;color:#7e8699;
    background:linear-gradient(180deg,#e9edf3,#f4f6fa);box-shadow:inset 0 1px 0 #fff,inset 0 1px 3px rgba(80,95,125,.18);transition:.2s;}

function hashRoom(text){
  const s=text.trim().toLowerCase();
  let h=5381; for(let i=0;i<s.length;i++) h=(((h<<5)+h)+s.charCodeAt(i))>>>0;
  let h2=52711; for(let i=s.length-1;i>=0;i--) h2=(((h2<<5)+h2)^s.charCodeAt(i))>>>0;
  return { key:'nikki:room:r'+h.toString(36)+h2.toString(36), number:(h%900000+100000) };

    eraserBtn.classList.remove('on');document.querySelectorAll('.stamp-btn').forEach(s=>s.classList.remove('on'));};
  colorsEl.appendChild(b);});
const eraserBtn=document.getElementById('eraser');
eraserBtn.onclick=()=>{mode=mode==='eraser'?'pen':'eraser';eraserBtn.classList.toggle('on',mode==='eraser');
  if(mode==='eraser'){document.querySelectorAll('.sw,.stamp-btn').forEach(s=>s.classList.remove('on'));}};
document.getElementById('undo').onclick=()=>{if(undoStack.length)ctx.putImageData(undoStack.pop(),0,0);};
document.getElementById('clear').onclick=()=>{pushUndo();ctx.clearRect(0,0,cv.width,cv.height);};

const stampsEl=document.getElementById('stamps');
function selStamp(btn,st){const was=btn.classList.contains('on');document.querySelectorAll('.stamp-btn').forEach(x=>x.classList.remove('on'));
  if(was){mode='pen';}else{mode='stamp';currentStamp=st;btn.classList.add('on');document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));eraserBtn.classList.remove('on');showToast('えがめんを タップして おいてね');}}
STAMP_MII.forEach(id=>{const b=document.createElement('button');b.className='stamp-btn mii';b.innerHTML=avatarSVG(id);b.title='Miiの顔';
  b.onclick=()=>selStamp(b,{type:'mii',val:id});stampsEl.appendChild(b);});
STAMPS.forEach(s=>{const b=document.createElement('button');b.className='stamp-btn';b.textContent=s;
  b.onclick=()=>selStamp(b,{type:'emoji',val:s});stampsEl.appendChild(b);});

document.querySelectorAll('[data-bg]').forEach(b=>{b.onclick=()=>{bgType=b.dataset.bg;
  document.querySelectorAll('[data-bg]').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawTemplate();};});

/* ========= 作者タブ ========= */
const tabMe=document.getElementById('tabMe'),tabYou=document.getElementById('tabYou');
function renderTabs(){
  document.getElementById('miniMe').innerHTML=avatarSVG(profile.me.avatar);
  document.getElementById('miniYou').innerHTML=avatarSVG(profile.you.avatar);
  document.getElementById('nameMe').textContent=profile.me.name||'じぶん';
  document.getElementById('nameYou').textContent=profile.you.name||'あいて';
}
function setAuthor(a){author=a;tabMe.classList.toggle('on',a==='me');tabYou.classList.toggle('on',a==='you');
  const nm=a==='me'?profile.me.name:profile.you.name;document.getElementById('hint').textContent=(nm||'')+'の日記';}
tabMe.onclick=()=>setAuthor('me');tabYou.onclick=()=>setAuthor('you');

/* ========= 日付・トースト ========= */
function todayLabel(){const d=new Date();const w=['日','月','火','水','木','金','土'][d.getDay()];
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' ('+w+')';}
const toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600);}

/* ========= ストレージ（Claude内はwindow.storage / 無い環境はlocalStorage） ========= */
const _ws=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:null;
const _mem={};
async function kvGet(k,sh){if(_ws){try{return await _ws.get(k,sh);}catch(_){return null;}}try{const v=localStorage.getItem(k);return v!=null?{key:k,value:v}:null;}catch(_){return _mem[k]!=null?{key:k,value:_mem[k]}:null;}}
async function kvSet(k,v,sh){if(_ws){try{return await _ws.set(k,v,sh);}catch(_){return null;}}try{localStorage.setItem(k,v);}catch(_){_mem[k]=v;}return {key:k,value:v};}
/* ========= 共有ストレージ ========= */
async function fetchRoom(){try{const r=await kvGet(roomStoreKey,true);if(r&&r.value)return JSON.parse(r.value);}catch(_){}return[];}
async function saveRoom(arr){try{await kvSet(roomStoreKey,JSON.stringify(arr),true);}catch(e){console.warn(e);showToast('ほぞんできなかった…');}}

/* ========= 表示 ========= */
const img=document.getElementById('entryImg'),empty=document.getElementById('empty');
const avatarEl=document.getElementById('avatar'),dateEl=document.getElementById('dateLabel'),pageEl=document.getElementById('pagenum');
const prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
function render(){
  if(entries.length===0){empty.hidden=false;img.hidden=true;avatarEl.hidden=dateEl.hidden=pageEl.hidden=true;
    prevBtn.classList.remove('show');nextBtn.classList.remove('show');return;}
  if(viewIdx>entries.length-1)viewIdx=entries.length-1;
  empty.hidden=true;img.hidden=false;const e=entries[viewIdx];
  img.src=e.image;img.classList.remove('entry-img');void img.offsetWidth;img.classList.add('entry-img');
  avatarEl.hidden=false;avatarEl.innerHTML=avatarSVG(e.avatarId!=null?e.avatarId:0)+'<div class="nm">'+(e.name||'')+'</div>';
  dateEl.hidden=false;{const sh=(e.dateLabel||'').replace(/^\d+\//,'');const mm=sh.match(/^(\S+)\s*(\(.*\))?$/);dateEl.innerHTML=(mm?mm[1]:sh)+'<br><small>'+(mm&&mm[2]?mm[2]:'')+'</small>';}
  pageEl.hidden=false;pageEl.textContent=(viewIdx+1);
  prevBtn.classList.toggle('show',viewIdx>0);nextBtn.classList.toggle('show',viewIdx<entries.length-1);
}
prevBtn.onclick=()=>{if(viewIdx>0){viewIdx--;render();}};
nextBtn.onclick=()=>{if(viewIdx<entries.length-1){viewIdx++;render();}};

/* ========= 合成（背景＋お絵かき） ========= */
function flattenURL(){const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;
  const x=t.getContext('2d');x.drawImage(bg,0,0);x.drawImage(cv,0,0);return t.toDataURL('image/png');}

/* ========= 保存（読み直してから追記） ========= */
document.getElementById('save').onclick=async()=>{
  const d=ctx.getImageData(0,0,cv.width,cv.height).data;let drawn=false;
  for(let i=3;i<d.length;i+=40){if(d[i]>0){drawn=true;break;}}
  if(!drawn){showToast('なにか かいてね');return;}
  const prof=author==='me'?profile.me:profile.you;
  const entry={name:prof.name,avatarId:prof.avatar,dateLabel:todayLabel(),image:flattenURL(),ts:Date.now()};
  if(FB_ON&&entriesRef){try{await _fb.push(entriesRef,entry);}catch(e){console.warn(e);showToast('そうしんできなかった…');return;}ctx.clearRect(0,0,cv.width,cv.height);undoStack.length=0;showToast('かけたよ！');}
  else{const latest=await fetchRoom();latest.push(entry);entries=latest;viewIdx=entries.length-1;latestLen=entries.length;setBadge(0);render();await saveRoom(entries);ctx.clearRect(0,0,cv.width,cv.height);undoStack.length=0;showToast('かけたよ！');}
};

/* ========= さいしん＋通知バッジ ========= */
function setBadge(n){badgeN=n;const b=document.getElementById('badge');b.textContent=n;b.classList.toggle('show',n>0);}
document.getElementById('refresh').onclick=async()=>{
  const before=entries.length;
  if(FB_ON&&entriesRef){try{const snap=await _fb.get(entriesRef);const val=snap.val()||{};entries=Object.keys(val).map(k=>val[k]).filter(Boolean).sort((a,b)=>((a.ts||0)-(b.ts||0)));}catch(_){}}
  else{entries=await fetchRoom();}
  latestLen=entries.length;viewIdx=Math.max(0,entries.length-1);setBadge(0);render();
  showToast(entries.length>before?('あたらしい日記が '+(entries.length-before)+'けん！'):'さいしんだよ');
};
function setPresence(n,nm){const el=document.getElementById('presence');
  if(n>0){el.className='presence on';el.innerHTML='<span class="dotpulse"></span>'+escapeHtml(nm||'あいて')+' が このへやにいるよ！';}
  else{el.className='presence';el.textContent='⚪ あいての とうじょうを まってるよ…';}}
async function beat(){if(!presKey)return;let obj={};
  try{const r=await kvGet(presKey,true);if(r&&r.value)obj=JSON.parse(r.value);}catch(_){}
  const now=Date.now();obj[clientId]={name:(profile.me.name||'じぶん'),ts:now};
  for(const k in obj){if(now-(obj[k].ts||0)>45000)delete obj[k];}
  try{await kvSet(presKey,JSON.stringify(obj),true);}catch(_){}
  let others=0,nm='';for(const k in obj){if(k!==clientId&&now-(obj[k].ts||0)<32000){others++;nm=obj[k].name||'あいて';}}
  setPresence(others,nm);}
async function poll(){if(FB_ON||!roomStoreKey||document.hidden)return;const arr=await fetchRoom();latestLen=arr.length;
  if(latestLen>entries.length)setBadge(latestLen-entries.length);await beat();}
setInterval(poll,9000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});

/* ========= 画像ほぞん・シェア ========= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function composeCard(e){
  const W=900,H=620,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f9f7fd');g.addColorStop(1,'#f0ecf8');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#dde07a';x.lineWidth=16;x.strokeRect(42,42,W-84,H-160);
  x.strokeStyle='#bcc04a';x.lineWidth=8;x.strokeRect(42,42,W-84,H-160);
  const im=await loadImg(e.image);const mw=W-220,mh=H-310,r=Math.min(mw/im.width,mh/im.height);
  const dw=im.width*r,dh=im.height*r;x.drawImage(im,(W-dw)/2,75,dw,dh);
  try{const av=await loadImg(avatarDataURI(e.avatarId!=null?e.avatarId:0,180));x.drawImage(av,52,H-152,90,90);}catch(_){}
  x.textAlign='left';x.fillStyle='#6f6880';x.font='700 32px "M PLUS Rounded 1c",sans-serif';x.fillText(e.name||'',150,H-92);
  x.textAlign='center';x.fillStyle='#8a7e9c';x.font='700 30px sans-serif';x.fillText(e.dateLabel,W/2,H-46);
  x.textAlign='right';x.fillStyle='#e8506f';x.font='800 28px "M PLUS Rounded 1c",sans-serif';x.fillText('こうかん日記',W-55,H-92);
  return c.toDataURL('image/png');
}
document.getElementById('saveImg').onclick=async()=>{
  if(!entries.length){showToast('まだ日記がないよ');return;}
  const url=await composeCard(entries[viewIdx]);const a=document.createElement('a');a.href=url;a.download='koukan_nikki.png';
  document.body.appendChild(a);a.click();a.remove();showToast('ほぞんしたよ！');
};
document.getElementById('shareImg').onclick=async()=>{
  if(!entries.length){showToast('まだ日記がないよ');return;}
  const url=await composeCard(entries[viewIdx]);
  try{const blob=await(await fetch(url)).blob();const file=new File([blob],'koukan_nikki.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:'こうかん日記'});return;}}catch(_){}
  const a=document.createElement('a');a.href=url;a.download='koukan_nikki.png';document.body.appendChild(a);a.click();a.remove();
  showToast('シェアにたいおうしてないので ほぞんしたよ');
};

/* ========= 設定モーダル ========= */
const modal=document.getElementById('modal');
let pick={me:profile.me.avatar,you:profile.you.avatar};
function buildAvGrid(el,who){el.innerHTML='';for(let i=0;i<AV_COUNT;i++){const b=document.createElement('button');
  b.className='avopt'+(pick[who]===i?' on':'');b.innerHTML=avatarSVG(i);
  b.onclick=()=>{pick[who]=i;el.querySelectorAll('.avopt').forEach(x=>x.classList.remove('on'));b.classList.add('on');};el.appendChild(b);}}
document.getElementById('settings').onclick=()=>{
  pick={me:profile.me.avatar,you:profile.you.avatar};
  document.getElementById('inMe').value=profile.me.name;document.getElementById('inYou').value=profile.you.name;
  buildAvGrid(document.getElementById('avMe'),'me');buildAvGrid(document.getElementById('avYou'),'you');
  modal.classList.add('show');
};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show');};
document.getElementById('saveProfile').onclick=async()=>{
  profile.me={name:(document.getElementById('inMe').value.trim()||'じぶん'),avatar:pick.me};
  profile.you={name:(document.getElementById('inYou').value.trim()||'あいて'),avatar:pick.you};
  try{await kvSet('nikki:profile',JSON.stringify(profile),false);}catch(_){}
  renderTabs();setAuthor(author);modal.classList.remove('show');showToast('ほぞんしたよ！');
};

/* ========= さいきんのへや ========= */
const recentBox=document.getElementById('recentBox'),chipsEl=document.getElementById('chips');
function renderChips(){
  if(!recent.length){recentBox.classList.add('hidden');return;}
  recentBox.classList.remove('hidden');chipsEl.innerHTML='';
  recent.forEach((it,idx)=>{
    const c=document.createElement('div');c.className='chip';
    c.innerHTML='<span>'+escapeHtml(it.word)+'</span><span class="no">No.'+it.number+'</span><span class="x">×</span>';
    c.querySelector('span').onclick=null;
    c.onclick=ev=>{if(ev.target.classList.contains('x'))return;enterRoom(it.word);};
    c.querySelector('.x').onclick=async ev=>{ev.stopPropagation();recent.splice(idx,1);await saveRecent();renderChips();};
    chipsEl.appendChild(c);
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
async function saveRecent(){try{await kvSet('nikki:recent',JSON.stringify(recent),false);}catch(_){}}
async function addRecent(word,number){
  recent=recent.filter(r=>r.word!==word);recent.unshift({word,number});if(recent.length>6)recent.length=6;
  await saveRecent();renderChips();
}

/* ========= 入室・退室 ========= */
const lock=document.getElementById('lock'),device=document.getElementById('device');
const wordInput=document.getElementById('word'),lockErr=document.getElementById('lockErr');
async function enterRoom(word){
  const w=word.trim();if(w.length<2){lockErr.textContent='2もじ いじょうで いれてね';return;}
  const {key,number}=hashRoom(w);roomStoreKey=key;presKey=key+':p';currentWord=w;
  document.getElementById('roomNo').textContent='No.'+number;
  lock.classList.add('hidden');device.classList.remove('hidden');
  requestAnimationFrame(()=>{fitCanvas();ctx.clearRect(0,0,cv.width,cv.height);undoStack.length=0;});
  if(FB_ON){fbDetach();entries=[];render();fbAttach(key);}
  else{entries=await fetchRoom();latestLen=entries.length;viewIdx=Math.max(0,entries.length-1);setBadge(0);render();offBar();beat();}
  await addRecent(w,number);
  try{await kvSet('nikki:lastword',w,false);}catch(_){}
}
document.getElementById('enterBtn').onclick=()=>enterRoom(wordInput.value);
wordInput.addEventListener('keydown',e=>{if(e.key==='Enter')enterRoom(wordInput.value);});
document.getElementById('leave').onclick=async()=>{
  if(FB_ON){fbDetach();}
  else{try{if(presKey){const r=await kvGet(presKey,true);let o=r&&r.value?JSON.parse(r.value):{};delete o[clientId];await kvSet(presKey,JSON.stringify(o),true);}}catch(_){}}
  presKey=null;roomStoreKey=null;entries=[];device.classList.add('hidden');lock.classList.remove('hidden');
  lockErr.textContent='';wordInput.value='';renderChips();wordInput.focus();};

/* ========= 起動 ========= */
(async function init(){
  preloadMii();
  FB_ON=await initFirebase();
  if(!FB_ON){const n=document.querySelector('.lock .note');if(n)n.innerHTML='※ あいことばが へやのカギ。ひみつにしてね<br><b style="color:#cd3d5e">いまは共有オフ（Firebase未設定）</b>';}
  try{const c=await kvGet('nikki:clientid',false);if(c&&c.value)clientId=c.value;else{clientId='c'+Math.random().toString(36).slice(2)+Date.now().toString(36);await kvSet('nikki:clientid',clientId,false);}}catch(_){clientId='c'+Math.random().toString(36).slice(2);}
  try{const p=await kvGet('nikki:profile',false);if(p&&p.value)profile=JSON.parse(p.value);}catch(_){}
  try{const r=await kvGet('nikki:recent',false);if(r&&r.value)recent=JSON.parse(r.value);}catch(_){}
  renderTabs();setAuthor('me');renderChips();
  try{const lw=await kvGet('nikki:lastword',false);if(lw&&lw.value){await enterRoom(lw.value);return;}}catch(_){}
  wordInput.focus();
})();
window.addEventListener('resize',()=>{if(!device.classList.contains('hidden'))fitCanvas();});
</script>
